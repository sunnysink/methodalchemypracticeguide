const renderCard = (card, i, openFaq, setOpenFaq) => {
  if (card.type === "tip" || card.type === "definition") {
    const isTip = card.type === "tip";
    return (
      <div key={i} style={{ ...shell, background: isTip ? `linear-gradient(135deg, ${p.deep}, ${p.deep2})` : shell.background }}>
        <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 10 }}>
          <div style={{ width: 30, height: 30, borderRadius: 999, display: "grid", placeItems: "center", background: isTip ? "rgba(255,255,255,0.1)" : p.goldFaint, color: isTip ? "#e8dfd2" : p.goldLight }}><SparkIcon /></div>
          <div style={{ ...titleS, marginBottom: 0, color: isTip ? p.cream : p.deep }}>{card.title}</div>
        </div>
        <div style={{ ...bodyS, color: isTip ? "rgba(232,223,210,0.8)" : p.text }}>{card.body}</div>
      </div>
    );
  }

  if (["steps", "choices", "questions", "examples"].includes(card.type)) {
    return (
      <div key={i} style={shell}>
        <div style={titleS}>{card.title}</div>
        <div style={{ display: "grid", gap: 8 }}>
          {card.items.map((item, idx) => (
            <NumItem key={idx} idx={idx} bg={idx % 2 === 0 ? p.goldFaint : p.rustFaint}>{item}</NumItem>
          ))}
        </div>
      </div>
    );
  }

  if (card.type === "grid") {
    return (
      <div key={i} style={shell}>
        <div style={titleS}>{card.title}</div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px, 1fr))", gap: 10 }}>
          {card.items.map((item, idx) => (
            <div key={idx} style={{ background: p.goldFaint, borderRadius: 8, padding: 14 }}>
              <div style={{ fontFamily: p.display, color: p.deep, fontSize: 17, fontWeight: 500, marginBottom: 6 }}>{item.name}</div>
              <div style={bodyS}>{item.body}</div>
            </div>
          ))}
        </div>
      </div>
    );
  }

  if (card.type === "twocol") return <TwoCol key={i} card={card} />;

  if (card.type === "idea-bank") {
    return (
      <div key={i} style={shell}>
        <div style={titleS}>{card.title}</div>
        <div style={{ ...bodyS, marginBottom: 14 }}>{card.intro}</div>
        <div style={{ display: "grid", gap: 10 }}>
          {card.groups.map((group, gIdx) => {
            const tone = TONE_MAP[group.tone] || TONE_MAP.gold;
            return (
              <div key={gIdx} style={{ background: tone.bg, borderRadius: 8, padding: 14 }}>
                <Pill bg={tone.badge} color={tone.color}>{group.title}</Pill>
                <div style={{ display: "grid", gap: 8 }}>
                  {group.items.map((item, idx) => (
                    <div key={idx} style={{ display: "flex", gap: 10, alignItems: "flex-start", background: "rgba(255,255,255,0.5)", borderRadius: 6, padding: 10 }}>
                      <div style={{ minWidth: 24, height: 24, borderRadius: 999, display: "grid", placeItems: "center", background: "rgba(255,255,255,0.7)", color: p.rust, fontFamily: p.body, fontWeight: 600, fontSize: 11 }}>{String(idx + 1).padStart(2, "0")}</div>
                      <div style={bodyS}>{item}</div>
                    </div>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  if (card.type === "scale") {
    return (
      <div key={i} style={shell}>
        <div style={titleS}>{card.title}</div>
        <div style={{ display: "grid", gap: 8 }}>
          {card.items.map((item, idx) => (
            <div key={idx} style={{ display: "grid", gridTemplateColumns: "46px 1fr", gap: 12, alignItems: "start", background: p.goldFaint, borderRadius: 8, padding: 12 }}>
              <div style={{ height: 36, borderRadius: 8, background: idx % 2 === 0 ? "rgba(164,84,52,0.08)" : p.tealFaint, display: "grid", placeItems: "center", fontFamily: p.display, fontSize: 22, fontWeight: 500, color: p.deep }}>{item.score}</div>
              <div style={bodyS}>{item.body}</div>
            </div>
          ))}
        </div>
      </div>
    );
  }

  if (card.type === "faq") {
    const faqKey = `${card.title}-${i}`;
    const isOpen = !!openFaq[faqKey];
    return (
      <div key={i} style={shell}>
        <button onClick={() => setOpenFaq(prev => ({ ...prev, [faqKey]: !isOpen }))} style={{ width: "100%", background: "transparent", border: "none", textAlign: "left", cursor: "pointer", padding: 0 }}>
          <div style={{ display: "flex", justifyContent: "space-between", gap: 12, alignItems: "center" }}>
            <div style={{ ...titleS, marginBottom: 0 }}>{card.title}</div>
            <div style={{ fontSize: 20, color: p.rust, fontFamily: p.body }}>{isOpen ? "−" : "+"}</div>
          </div>
        </button>
        {isOpen && <div style={{ ...bodyS, marginTop: 12 }}>{card.body}</div>}
      </div>
    );
  }

  return null;
};

                        background: isActive ? gradientBg : idx % 2 === 0 ? p.goldFaint : "rgba(255,251,245,0.58)",
                        color: isActive ? p.cream : p.text, transition: "all .2s ease" }}>
                      <div style={{ fontFamily: p.body, fontSize: 10, textTransform: "uppercase", letterSpacing: ".12em", fontWeight: 500, opacity: .65, marginBottom: 3 }}>{section.eyebrow}</div>
                      <div style={{ fontFamily: p.display, fontSize: 17, fontWeight: 500, lineHeight: 1.15 }}>{section.label}</div>
                    </button>
                  );
                })}
              </div>
              <a href="https://www.skool.com/7-day-method-alchemy-challenge" target="_blank" rel="noopener noreferrer"
                style={{ display: "block", marginTop: 12, background: gradientBg, borderRadius: 8, padding: 12, textDecoration: "none", textAlign: "center" }}>
                <div style={{ fontFamily: p.display, color: p.cream, fontSize: 16, fontWeight: 500, marginBottom: 2 }}>Go to the Community</div>
                <div style={{ fontFamily: p.body, fontSize: 11, color: "rgba(232,223,210,0.55)" }}>Open in Skool ✦</div>
              </a>
            </div>
          </aside>

          {/* ── MAIN ── */}
          <main>
            {currentSection && (
              <div style={{ display: "grid", gap: 14 }}>
                {/* Section header */}
                <div style={{ position: "relative", overflow: "hidden", borderRadius: 12, padding: 22, background: "rgba(255,251,245,0.72)", border: `1px solid ${p.border}` }}>
                  <Pill bg={p.goldFaint} color={p.gold}>{currentSection.eyebrow}</Pill>
                  <h2 style={{ margin: 0, fontFamily: p.display, fontSize: "clamp(30px, 5vw, 50px)", fontWeight: 500, lineHeight: 1.04, color: p.deep }}>{currentSection.title}</h2>
                  <div style={{ fontFamily: p.accent, fontStyle: "italic", fontSize: "clamp(17px, 3vw, 26px)", fontWeight: 400, color: p.rust, marginTop: 6 }}>{currentSection.accent}</div>
                  <p style={{ margin: "14px 0 0", maxWidth: 880, fontFamily: p.body, fontSize: 15.5, lineHeight: 1.8, color: p.text }}>{currentSection.intro}</p>
                </div>

                {currentSection.cards.map((card, i) => renderCard(card, i, openFaq, setOpenFaq))}
              </div>
            )}
          </main>
        </div>

        {/* ── FOOTER ── */}
        <footer style={{ marginTop: 40, padding: "24px 0 0", borderTop: `1px solid ${p.borderMed}`, textAlign: "center", fontFamily: p.body, fontSize: 13, lineHeight: 1.9, color: p.textLight }}>
          <div style={{ display: "flex", justifyContent: "center", gap: 8, flexWrap: "wrap", marginBottom: 8 }}>
            <a href="https://www.sunnysink.com/privacy-policy" target="_blank" rel="noopener noreferrer" style={{ color: p.gold, textDecoration: "none", fontWeight: 600, letterSpacing: ".06em", textTransform: "uppercase", fontSize: 11.5 }}>Privacy Policy</a>
            <span style={{ color: p.border }}>|</span>
            <a href="https://go.sunnysink.com/sales-page1747865004072#https://www.sunnysink.com/terms-conditions" target="_blank" rel="noopener noreferrer" style={{ color: p.gold, textDecoration: "none", fontWeight: 600, letterSpacing: ".06em", textTransform: "uppercase", fontSize: 11.5 }}>Terms &amp; Conditions</a>
          </div>
          <div>© 2026 S Sink Coaching</div>
          <div>PO Box 1651 Gillette, WY 82717-1651</div>
          <div><a href="mailto:support@sunnysink.com" style={{ color: p.gold, textDecoration: "none" }}>support@sunnysink.com</a></div>
        </footer>
      </div>
    </div>
  );
}
